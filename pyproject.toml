[project]
name = "oregon-surf-analysis"
version = "0.1.0"
description = "Data analysis project comparing offshore wave and wind climate across three regions of the Oregon coast using NDBC buoy data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "ndbc-api>=0.25.10.28.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]
